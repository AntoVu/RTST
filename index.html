<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>RTST</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RTST <span>Spanish ⇄ English</span></h1>
    <button id="open-settings" aria-label="Settings">Settings</button>
  </header>

  <main id="chat" aria-live="polite">
    <p id="empty">Tap <b>Listen</b> (or Space) and it stops when the speaker pauses.<br>Hold it to keep listening until you let go.</p>
  </main>

  <footer>
    <div id="status" role="status"></div>
    <div class="controls">
      <div id="meter" aria-hidden="true"><div id="level"></div></div>
      <button id="listen">Listen</button>
    </div>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Claude API key
        <input id="api-key" type="password" autocomplete="off" placeholder="sk-ant-...">
      </label>
      <label>Context file (who you are, your business, prices, FAQs)
        <span class="row"><span id="context-path">None chosen</span><button type="button" id="pick-context">Choose…</button></span>
      </label>
      <label>Speech threshold <output id="threshold-out"></output>
        <input id="threshold" type="range" min="0.002" max="0.08" step="0.002">
        <small>Raise it if background noise keeps listening from stopping.</small>
      </label>
      <label>Pause before auto-stop (seconds)
        <input id="silence" type="number" min="0.4" max="5" step="0.1">
      </label>
      <div class="row">
        <button type="button" id="clear-chat" class="danger">Clear conversation</button>
        <button value="save" id="save-settings">Save</button>
      </div>
    </form>
  </dialog>

  <template id="them-tpl">
    <div class="msg them"><div class="es"></div><div class="en pending">…</div></div>
  </template>
  <template id="me-tpl">
    <div class="msg me"><span class="badge" hidden>generic</span><div class="es pending">Drafting reply…</div><div class="pron"></div><div class="en"></div></div>
  </template>

  <script src="endpoint.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
