<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>RTST</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RTST <span>Spanish ⇄ English</span></h1>
    <div class="header-actions">
      <button id="end-meeting">End meeting</button>
      <button id="open-settings">Settings</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" aria-label="Things to say">
      <section>
        <div class="section-head">
          <h2>Suggestions</h2>
          <button id="suggest">Suggest</button>
        </div>
        <ul id="suggestions" class="starters"><li class="hint">Ideas based on your context and the conversation.</li></ul>
      </section>
      <section id="context-questions" hidden>
        <h2>From your context</h2>
        <div id="question-groups"></div>
      </section>
      <section>
        <details open>
          <summary><h2>Quick phrases</h2></summary>
          <ul id="quick" class="starters"></ul>
        </details>
      </section>
    </aside>

    <div class="conversation">
      <main id="chat" aria-live="polite">
        <p id="empty">
          <b>Tap</b> Listen (or Space): stops when they pause.<br>
          <b>Hold</b>: listens until you let go.<br>
          <b>Double-tap</b>: listens through any pause until you tap again.
        </p>
      </main>

      <footer>
        <div id="status" role="status"></div>
        <div class="controls">
          <div id="meter" aria-hidden="true"><div id="level"></div></div>
          <button id="listen">Listen</button>
        </div>
      </footer>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Context file (who you are, the situation, your goals)
        <span class="row"><span id="context-path">None chosen</span><button type="button" id="pick-context">Choose…</button></span>
      </label>
      <label>Speech threshold <output id="threshold-out"></output>
        <input id="threshold" type="range" min="0.002" max="0.08" step="0.002">
        <small>Raise it if background noise keeps listening from stopping.</small>
      </label>
      <label>Pause before auto-stop (seconds)
        <input id="silence" type="number" min="0.4" max="5" step="0.1">
      </label>
      <label>Memory and meeting transcripts
        <span class="row"><small>memory.md and meetings/</small><button type="button" id="open-data">Open folder</button></span>
      </label>
      <div class="row">
        <button type="button" id="clear-chat" class="danger">Clear without saving notes</button>
        <button value="save" id="save-settings">Save</button>
      </div>
    </form>
  </dialog>

  <template id="them-tpl">
    <div class="msg them"><div class="es"></div><div class="en pending">…</div></div>
  </template>
  <template id="me-tpl">
    <div class="msg me"><div class="es pending">Drafting reply…</div><div class="pron"></div><div class="en"></div></div>
  </template>

  <script src="endpoint.js"></script>
  <script src="pronounce.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
